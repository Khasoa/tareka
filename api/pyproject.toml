[project]
name = "api"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Lydia Khasoa" }
]
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.0",
    "argon2-cffi>=25.1.0",
    "boto3>=1.42.0",
    "fastapi>=0.141.1",
    "pillow>=12.0.0",
    "psycopg>=3.3.6",
    "pyyaml>=6.0.2",
    "pydantic-settings>=2.15.0",
    "python-multipart>=0.0.20",
    "slowapi>=0.1.10",
    "sqlalchemy>=2.1.1",
    "uvicorn>=0.54.0",
]

[tool.uv.build-backend]
module-name = "app"
module-root = ""

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "ruff>=0.16.9",
]

[tool.ruff.lint]
ignore = ["B008"]

[tool.mypy]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["yaml", "boto3", "boto3.*", "botocore", "botocore.*"]
ignore_missing_imports = true